<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MoreGroups</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f1f1f;
    --muted: #5f6368;
    --line: #dadce0;
    --hover: #f1f3f4;
    --active: #e8f0fe;
    --radius: 7px;
    --indent: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --line: #3c4043;
      --hover: #292a2d;
      --active: #2d3d5c;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }

  header h1 {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
    flex: 1;
  }

  header button {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: var(--radius);
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
  }

  header button:hover { background: var(--hover); }

  #tree { padding: 6px 8px 24px; }

  /* Cada nivel vive dentro de um bloco com guia vertical a esquerda:
     e isso que produz a sensacao de aninhamento real. */
  .children {
    margin-left: var(--indent);
    padding-left: 10px;
    border-left: 1.5px solid var(--line);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 6px;
    border-radius: var(--radius);
    cursor: pointer;
    user-select: none;
    min-height: 26px;
  }

  .row:hover { background: var(--hover); }
  .row.current { background: var(--active); }

  .caret {
    width: 12px;
    min-width: 12px;
    text-align: center;
    color: var(--muted);
    font-size: 9px;
    transition: transform .12s ease;
  }

  .caret.collapsed { transform: rotate(-90deg); }
  .caret.leaf { visibility: hidden; }

  .dot {
    width: 9px;
    min-width: 9px;
    height: 9px;
    border-radius: 50%;
  }

  .group-title {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .badge {
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 0 5px;
    line-height: 15px;
  }

  .favicon {
    width: 15px;
    min-width: 15px;
    height: 15px;
    border-radius: 3px;
  }

  .tab-title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .parked .tab-title, .parked .group-title { opacity: .55; }

  .section-label {
    margin: 12px 6px 4px;
    font-size: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .empty {
    padding: 28px 16px;
    text-align: center;
    color: var(--muted);
  }
</style>
</head>
<body>
  <header>
    <h1>Arvore de grupos</h1>
    <button id="collapse-all" type="button">Colapsar tudo</button>
  </header>
  <div id="tree"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
